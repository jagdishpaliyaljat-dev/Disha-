name: Build Android APK (Disha PYQ)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Disha PYQ Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://eaidivceejkdqsshlraj.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_HSl8o7bm-TQMIFbEnbp7TA_TfBfiv_0' }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: pnpm run build

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Setup Fixed Keystore for Consistent APK Signatures
        run: |
          if [ ! -f android/app/release.keystore ]; then
            echo "Generating persistent signing keystore..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias disha \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "DishaApp2020Pass" \
              -keypass "DishaApp2020Pass" \
              -dname "CN=Disha 20-20, OU=ExamPrep, O=Disha, L=Jaipur, ST=Rajasthan, C=IN"
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Disha-PYQ-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signing Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Disha-Signing-Keystore
          path: android/app/release.keystore
          if-no-files-found: warn
          retention-days: 90

      - name: Prepare Named Release APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Disha-PYQ-${{ github.ref_name || 'v1.0.23' }}.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/app/build/outputs/apk/debug/Disha-PYQ-${{ github.ref_name || 'v1.0.23' }}.apk
          name: "Disha PYQ ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
