name: Build Android Release AAB & APK (Disha PYQ)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Disha PYQ Release AAB & APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://eaidivceejkdqsshlraj.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_HSl8o7bm-TQMIFbEnbp7TA_TfBfiv_0' }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: pnpm run build

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Setup Signing Keystore from Secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            chmod 600 android/app/release.keystore
          else
            echo "Generating release keystore fallback..."
            keytool -genkey -v -keystore android/app/release.keystore -alias disha -keyalg RSA -keysize 2048 -validity 10000 -storepass disha2020 -keypass disha2020 -dname "CN=Disha PYQ, OU=EdTech, O=Disha, L=Jaipur, S=Rajasthan, C=IN"
          fi

      - name: Build Android Bundle (AAB for Play Store) & Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'disha2020' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'disha2020' }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS || 'disha' }}
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Disha-PYQ-PlayStore-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Disha-PYQ-Universal-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          name: "Disha PYQ Play Store Ready ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
