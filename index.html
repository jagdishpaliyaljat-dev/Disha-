    <script>
      (function() {
        if (typeof window === 'undefined') return;
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason instanceof Error ? reason.message : String(reason || '');
          if (
            msg.includes('WebSocket closed without opened') || 
            msg.includes('vite:ws:disconnect') ||
            msg.includes('INTERNAL ASSERTION FAILED') ||
            msg.includes('Unexpected state') ||
            msg.includes('c050') ||
            msg.includes('b815') ||
            msg.includes('QuotaExceededError') ||
            msg.includes('Exceeded the quota')
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = event && (event.message || (event.error instanceof Error ? event.error.message : String(event.error || '')));
          if (
            msg && (
              msg.includes('WebSocket closed without opened') || 
              msg.includes('[vite]') ||
              msg.includes('INTERNAL ASSERTION FAILED') ||
              msg.includes('Unexpected state') ||
              msg.includes('c050') ||
              msg.includes('b815') ||
              msg.includes('QuotaExceededError') ||
              msg.includes('Exceeded the quota')
            )
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        });
        if (window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            const isViteHmr = (Array.isArray(protocols) 
              ? (protocols.includes('vite-hmr') || protocols.includes('vite-ping')) 
              : (protocols === 'vite-hmr' || protocols === 'vite-ping')) || 
              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/')));

            if (isViteHmr) {
              const target = new EventTarget();
              target.readyState = 1;
              target.OPEN = 1;
              target.CONNECTING = 0;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.send = function() {};
              target.close = function() {};
              target.url = url;
              target.protocol = typeof protocols === 'string' ? protocols : 'vite-hmr';
              target.binaryType = 'blob';
              setTimeout(function() {
                try {
                  target.dispatchEvent(new Event('open'));
                } catch (e) {}
              }, 0);
              return target;
            }
            return new NativeWebSocket(url, protocols);
          }
          ViteSafeWebSocket.prototype = NativeWebSocket.prototype;
          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;
          window.WebSocket = ViteSafeWebSocket;
        }
      })();
    </script>
