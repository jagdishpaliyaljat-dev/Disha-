<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>दिशा PYQ - सुरक्षित पेमेंट गेटवे</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #0f0a1c;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #8b5cf6;
      border-right-color: #ec4899;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 10px;
      color: #f1f5f9;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin: 0 0 20px;
      line-height: 1.5;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #c4b5fd;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .shield-icon {
      width: 14px;
      height: 14px;
    }
    .note {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg class="shield-icon" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
      </svg>
      256-Bit बैंक एन्क्रिप्टेड पेमेंट
    </div>
    <div class="spinner"></div>
    <h2>आधिकारिक Cashfree गेटवे खोला जा रहा है...</h2>
    <p>Google Pay, PhonePe, Paytm व कार्ड्स लोड हो रहे हैं, कृपया प्रतीक्षा करें।</p>
    <div class="note">पेज को रिफ्रेश या बंद न करें।</div>
  </div>

  <form id="cf-form" method="POST" action="https://api.cashfree.com/pg/view/sessions/checkout">
    <input type="hidden" name="payment_session_id" id="session-input" value="">
  </form>

  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var session = params.get("session_id") || params.get("payment_session_id");
        var mode = (params.get("mode") || "production").toLowerCase();

        if (session) {
          var form = document.getElementById("cf-form");
          if (mode === "sandbox" || mode === "test") {
            form.action = "https://sandbox.cashfree.com/pg/view/sessions/checkout";
          } else {
            form.action = "https://api.cashfree.com/pg/view/sessions/checkout";
          }
          document.getElementById("session-input").value = session;
          // Short delay to ensure browser context is settled
          setTimeout(function() {
            form.submit();
          }, 300);
        } else {
          document.querySelector(".card").innerHTML =
            "<h2 style='color:#f87171;'>त्रुटि: अमान्य पेमेंट सेशन</h2>" +
            "<p>पेमेंट सेशन आईडी नहीं मिली। कृपया ऐप से दोबारा प्रयास करें।</p>";
        }
      } catch (err) {
        console.error("Checkout init error:", err);
      }
    })();
  </script>
</body>
</html>
