<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disha PYQ - Google Login Handover</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #171329;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .card {
      background: #241D48;
      border: 1px solid #31275E;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #31275E;
      border-top-color: #A78BFA;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 10px; font-size: 18px; font-weight: 700; color: #fff; }
    p { margin: 0 0 24px; font-size: 13px; color: #CBD5E1; line-height: 1.5; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #7045D8, #5B32BF);
      color: #ffffff;
      text-decoration: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(112, 69, 216, 0.4);
      transition: transform 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Google लॉगिन सफल!</h2>
    <p>Disha PYQ ऐप में वापस पहुँचाया जा रहा है...</p>
    <a id="deepLinkBtn" class="btn" href="#">दिशा ऐप खोलें</a>
  </div>

  <script>
    (function() {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var combined = hash ? (search ? hash + '&' + search.substring(1) : hash) : search;
      var primaryDeepLink = 'com.rajexam.prep://auth-callback' + combined;
      var fallbackDeepLink = 'disha2020://auth-callback' + combined;

      var btn = document.getElementById('deepLinkBtn');
      if (btn) {
        btn.href = primaryDeepLink;
        btn.onclick = function() {
          setTimeout(function() {
            window.location.href = fallbackDeepLink;
          }, 1500);
        };
      }

      // Automatically trigger app launch
      try {
        window.location.replace(primaryDeepLink);
      } catch (e) {
        try {
          window.location.href = primaryDeepLink;
        } catch (_) {}
      }

      // Secondary fallback trigger after 800ms
      setTimeout(function() {
        try {
          window.location.href = primaryDeepLink;
        } catch (_) {}
      }, 800);
    })();
  </script>
</body>
</html>
